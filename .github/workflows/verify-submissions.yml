name: Verify submissions

# Looks for submissions/<activity-id>/<name>/ folders that changed in the PR, and
# if activities/<activity-id>/check.sh exists, runs it as: check.sh <submission-dir>.

on:
  pull_request:
    branches: [main]
    paths:
      - 'submissions/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed files
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          CHANGED="$(git diff --name-only "origin/$BASE_REF"...HEAD -- submissions/)"
          echo "Changed submission files:"
          echo "$CHANGED"
          {
            echo "files<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Reject changes outside submissions/
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          ALL_CHANGED="$(git diff --name-only "origin/$BASE_REF"...HEAD)"
          BAD="$(echo "$ALL_CHANGED" | grep -v '^submissions/' || true)"
          if [ -n "$BAD" ]; then
            echo "This PR modifies files outside submissions/ — not allowed:"
            echo "$BAD"
            exit 1
          fi

      - name: Check every changed submission
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -e
          # submissions/<activity-id>/<name>/... -> unique "activity-id/name" pairs
          pairs="$(echo "$CHANGED_FILES" | grep -oE '^submissions/[^/]+/[^/]+' | sed 's#^submissions/##' | sort -u)"

          if [ -z "$pairs" ]; then
            echo "No submission folders changed in this PR."
            exit 0
          fi

          overall_fail=0
          while IFS= read -r pair; do
            [ -z "$pair" ] && continue
            activity_id="${pair%%/*}"
            name="${pair#*/}"
            submission_dir="submissions/$activity_id/$name"
            checker="activities/$activity_id/check.sh"

            echo "::group::$activity_id — $name"
            if [ -f "$checker" ]; then
              if bash "$checker" "$submission_dir"; then
                echo "PASS: $submission_dir"
              else
                echo "FAIL: $submission_dir"
                overall_fail=1
              fi
            else
              file_count="$(find "$submission_dir" -type f ! -name '.gitkeep' | wc -l | tr -d ' ')"
              if [ "$file_count" -gt 0 ]; then
                echo "No automated checker for '$activity_id' — this activity is graded"
                echo "manually. Submission folder has $file_count file(s): OK."
              else
                echo "FAIL: $submission_dir has no files (besides .gitkeep)."
                overall_fail=1
              fi
            fi
            echo "::endgroup::"
          done <<< "$pairs"

          exit "$overall_fail"
